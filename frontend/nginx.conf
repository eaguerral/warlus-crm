server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth:8081/;
        proxy_set_header Host $host;
    }

    location /api/catalogo/ {
        proxy_pass http://catalogo:8082/;
        proxy_set_header Host $host;
    }

    location /api/pedidos/ {
        proxy_pass http://pedidos:8083/;
        proxy_set_header Host $host;
    }

    location /api/pagos/ {
        proxy_pass http://pagos:8084/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
