trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - qa
      - prod
      - main

pool:
  name: Default

stages:

  - stage: Validate
    displayName: Validacion Python y pruebas

    jobs:
      - job: ValidateServices
        displayName: Validar FastAPI y ejecutar pytest

        steps:

          - checkout: self
            clean: true

          - powershell: |
              $python = "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe"

              if (-not (Test-Path $python)) {
                  throw "Python 3.12 no esta instalado en el agente."
              }

              & $python --version

              $venv = "$(Agent.TempDirectory)\warlus-pipeline-venv"

              if (Test-Path $venv) {
                  Remove-Item $venv -Recurse -Force
              }

              & $python -m venv $venv

              if ($LASTEXITCODE -ne 0) {
                  throw "No se pudo crear el entorno virtual."
              }

              $pipelinePython = "$venv\Scripts\python.exe"

              & $pipelinePython -m pip install --upgrade pip

              if ($LASTEXITCODE -ne 0) {
                  throw "No se pudo preparar pip."
              }

              Write-Host "##vso[task.setvariable variable=PipelinePython]$pipelinePython"

            displayName: Preparar Python 3.12

          - powershell: |
              & "$(PipelinePython)" -m pip install -r requirements-test.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la instalacion de dependencias Auth."
              }

              & "$(PipelinePython)" -m py_compile main.py

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la validacion de sintaxis Auth."
              }

              & "$(PipelinePython)" -m pytest test_main.py -v --junitxml=test-results.xml

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallaron las pruebas Auth."
              }

            workingDirectory: src/auth
            displayName: Validar y probar Auth

          - powershell: |
              & "$(PipelinePython)" -m pip install -r requirements-test.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la instalacion de dependencias Catalogo."
              }

              & "$(PipelinePython)" -m py_compile main.py

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la validacion de sintaxis Catalogo."
              }

              & "$(PipelinePython)" -m pytest test_main.py -v --junitxml=test-results.xml

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallaron las pruebas Catalogo."
              }

            workingDirectory: src/catalogo
            displayName: Validar y probar Catalogo

          - powershell: |
              & "$(PipelinePython)" -m pip install -r requirements-test.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la instalacion de dependencias Pedidos."
              }

              & "$(PipelinePython)" -m py_compile main.py

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la validacion de sintaxis Pedidos."
              }

              & "$(PipelinePython)" -m pytest test_main.py -v --junitxml=test-results.xml

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallaron las pruebas Pedidos."
              }

            workingDirectory: src/pedidos
            displayName: Validar y probar Pedidos

          - powershell: |
              & "$(PipelinePython)" -m pip install -r requirements-test.txt

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la instalacion de dependencias Pagos."
              }

              & "$(PipelinePython)" -m py_compile main.py

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo la validacion de sintaxis Pagos."
              }

              & "$(PipelinePython)" -m pytest test_main.py -v --junitxml=test-results.xml

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallaron las pruebas Pagos."
              }

            workingDirectory: src/pagos
            displayName: Validar y probar Pagos

          - task: PublishTestResults@2
            displayName: Publicar resultados pytest
            condition: succeededOrFailed()

            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'src/**/test-results.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              testRunTitle: 'Pruebas FastAPI Warlus CRM'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true


  - stage: DockerBuild
    displayName: Construccion de imagenes FastAPI
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: Construir microservicios Python

        steps:

          - powershell: |
              docker --version

              if ($LASTEXITCODE -ne 0) {
                  throw "Docker no esta disponible."
              }

            displayName: Verificar Docker

          - powershell: |
              docker build -t warlus-auth:$(Build.BuildId) ./src/auth

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo Build Auth."
              }

            displayName: Build Auth FastAPI

          - powershell: |
              docker build -t warlus-catalogo:$(Build.BuildId) ./src/catalogo

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo Build Catalogo."
              }

            displayName: Build Catalogo FastAPI

          - powershell: |
              docker build -t warlus-pedidos:$(Build.BuildId) ./src/pedidos

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo Build Pedidos."
              }

            displayName: Build Pedidos FastAPI

          - powershell: |
              docker build -t warlus-pagos:$(Build.BuildId) ./src/pagos

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo Build Pagos."
              }

            displayName: Build Pagos FastAPI

          - powershell: |
              docker images

            displayName: Verificar imagenes generadas


  - stage: Deploy
    displayName: Despliegue continuo FastAPI
    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: DeployCompose
        displayName: Desplegar Warlus CRM

        steps:

          - powershell: |
              docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  config `
                  --quiet

              if ($LASTEXITCODE -ne 0) {
                  throw "Docker Compose contiene errores."
              }

            displayName: Validar Docker Compose

          - powershell: |
              docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  down `
                  --remove-orphans

              docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  up `
                  -d `
                  --build

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo el despliegue Docker Compose."
              }

            displayName: Desplegar servicios FastAPI

          - powershell: |
              Start-Sleep -Seconds 12

              $postgres = docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  exec `
                  -T `
                  postgres `
                  pg_isready `
                  -U warlus_user `
                  -d warlus

              if ($LASTEXITCODE -ne 0) {
                  throw "PostgreSQL no esta disponible."
              }

              Write-Host $postgres

              $redis = docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  exec `
                  -T `
                  redis `
                  redis-cli `
                  ping

              if ($LASTEXITCODE -ne 0) {
                  throw "Redis no esta disponible."
              }

              if ($redis -notmatch "PONG") {
                  throw "Redis no respondio PONG."
              }

              Write-Host "Redis: $redis"

            displayName: Verificar PostgreSQL y Redis

          - powershell: |
              $services = @(
                  @{
                      Name = "Auth"
                      Expected = "auth"
                      Url = "http://localhost:8081/health"
                  },
                  @{
                      Name = "Catalogo"
                      Expected = "catalogo"
                      Url = "http://localhost:8082/health"
                  },
                  @{
                      Name = "Pedidos"
                      Expected = "pedidos"
                      Url = "http://localhost:8083/health"
                  },
                  @{
                      Name = "Pagos"
                      Expected = "pagos"
                      Url = "http://localhost:8084/health"
                  }
              )

              foreach ($service in $services) {

                  $response = $null
                  $ready = $false

                  for ($i = 1; $i -le 15; $i++) {

                      try {

                          $response = Invoke-RestMethod `
                              -Uri $service.Url `
                              -Method GET `
                              -TimeoutSec 5

                          $ready = $true
                          break
                      }
                      catch {

                          Write-Host "Esperando $($service.Name)... intento $i"
                          Start-Sleep -Seconds 2
                      }
                  }

                  if (-not $ready) {
                      throw "$($service.Name) no respondio."
                  }

                  if ($response.service -ne $service.Expected) {
                      throw "$($service.Name) devolvio un service incorrecto."
                  }

                  if ($response.status -ne "OK") {
                      throw "$($service.Name) no devolvio status OK."
                  }

                  Write-Host "$($service.Name): OK"
              }

            displayName: Verificar endpoints FastAPI

          - powershell: |
              docker compose `
                  -p warlus-crm `
                  --env-file .env.example `
                  ps

            displayName: Estado final de contenedores
# ============================================================
# DESPLIEGUE CLOUD - AZURE APP SERVICE
# ============================================================

  - stage: DeployAzureAuth
    displayName: 'Despliegue Auth en Azure App Service'
    dependsOn:
      - Validate
      - DockerBuild
      - Deploy
    condition: succeeded()

    jobs:
      - job: DeployAuthAzure
        displayName: 'Deploy FastAPI Auth a Azure'
        pool:
          name: Default

        steps:

          - checkout: self

          - task: PowerShell@2
            displayName: 'Preparar paquete Auth'
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"

                $source = "$(Build.SourcesDirectory)\src\auth"
                $temp   = "$(Build.ArtifactStagingDirectory)\auth"
                $zip    = "$(Build.ArtifactStagingDirectory)\warlus-auth.zip"

                if (-not (Test-Path "$source\main.py")) {
                    throw "No existe src\auth\main.py"
                }

                if (-not (Test-Path "$source\requirements.txt")) {
                    throw "No existe src\auth\requirements.txt"
                }

                if (Test-Path $temp) {
                    Remove-Item $temp -Recurse -Force
                }

                if (Test-Path $zip) {
                    Remove-Item $zip -Force
                }

                New-Item -ItemType Directory -Path $temp -Force | Out-Null

                Copy-Item "$source\main.py" "$temp\main.py"
                Copy-Item "$source\requirements.txt" "$temp\requirements.txt"

                Compress-Archive `
                  -Path "$temp\*" `
                  -DestinationPath $zip `
                  -Force

                Write-Host "Paquete generado:"
                Write-Host $zip

          - task: AzureCLI@2
            displayName: 'Desplegar Auth en App Service'
            inputs:
              azureSubscription: 'sc-warlus-azure-dev'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = "Stop"

                az webapp deploy `
                  --resource-group "rg-warlus-crm-dev" `
                  --name "warlus-auth-dev-eguerral" `
                  --src-path "$(Build.ArtifactStagingDirectory)\warlus-auth.zip" `
                  --type zip `
                  --clean true

          - task: PowerShell@2
            displayName: 'Validar FastAPI en Azure'
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"

                $baseUrl = "https://warlus-auth-dev-eguerral-akhgbqazerd4dxd3.canadacentral-01.azurewebsites.net"

                $ready = $false

                for ($i = 1; $i -le 20; $i++) {

                    try {

                        $health = Invoke-RestMethod `
                          -Uri "$baseUrl/health" `
                          -Method GET `
                          -TimeoutSec 10

                        if (
                            $health.service -eq "auth" -and
                            $health.status -eq "OK"
                        ) {
                            $ready = $true
                            break
                        }

                    }
                    catch {
                        Write-Host "Intento $i de 20..."
                        Start-Sleep -Seconds 5
                    }
                }

                if (-not $ready) {
                    throw "Auth no respondio correctamente en Azure."
                }

                Write-Host ""
                Write-Host "/health OK"
                Write-Host "service = $($health.service)"
                Write-Host "status  = $($health.status)"

                $docs = Invoke-WebRequest `
                  -Uri "$baseUrl/docs" `
                  -UseBasicParsing `
                  -TimeoutSec 10

                if ($docs.StatusCode -ne 200) {
                    throw "/docs no respondio HTTP 200"
                }

                $openapi = Invoke-RestMethod `
                  -Uri "$baseUrl/openapi.json" `
                  -TimeoutSec 10

                if (-not $openapi.openapi) {
                    throw "/openapi.json no respondio correctamente"
                }

                Write-Host "/docs OK"
                Write-Host "/openapi.json OK"


