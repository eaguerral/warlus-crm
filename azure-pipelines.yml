trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - qa
      - prod
      - main

pool:
  name: Default

variables:
  TEST_JWT_SECRET: 'pipeline-only-secret-warlus-2026-at-least-32-characters'

stages:

  - stage: Validate
    displayName: Validacion completa

    jobs:

      - job: BackendTests
        displayName: Pytest cuatro microservicios

        steps:

          - checkout: self
            clean: true

          - powershell: |
              $python = "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe"

              if (-not (Test-Path $python)) {
                  throw "Python 3.12 no esta instalado en el agente."
              }

              $venv = "$(Agent.TempDirectory)\warlus-pipeline-venv"

              if (Test-Path $venv) {
                  Remove-Item $venv -Recurse -Force
              }

              & $python -m venv $venv

              $pipelinePython = "$venv\Scripts\python.exe"

              & $pipelinePython -m pip install --upgrade pip

              Write-Host "##vso[task.setvariable variable=PipelinePython]$pipelinePython"

            displayName: Preparar Python

          - powershell: |
              $env:SKIP_DB_STARTUP = "true"
              $env:APP_ENV = "test"
              $env:JWT_SECRET = "$(TEST_JWT_SECRET)"
              $env:JWT_ISSUER = "warlus-crm"
              $env:JWT_AUDIENCE = "warlus-crm-web"

              $services = @(
                  "auth",
                  "catalogo",
                  "pedidos",
                  "pagos"
              )

              foreach ($service in $services) {

                  Write-Host ""
                  Write-Host "===== $service ====="

                  Push-Location "src\$service"

                  & "$(PipelinePython)" -m pip install -r requirements-test.txt

                  if ($LASTEXITCODE -ne 0) {
                      Pop-Location
                      throw "Fallo instalacion: $service"
                  }

                  Get-ChildItem -Filter *.py | ForEach-Object {
                      & "$(PipelinePython)" -m py_compile $_.Name

                      if ($LASTEXITCODE -ne 0) {
                          Pop-Location
                          throw "Fallo py_compile: $service\$($_.Name)"
                      }
                  }

                  & "$(PipelinePython)" -m pytest test_main.py -v --junitxml=test-results.xml

                  if ($LASTEXITCODE -ne 0) {
                      Pop-Location
                      throw "Fallaron pruebas: $service"
                  }

                  Pop-Location
              }

            displayName: Ejecutar pruebas backend

          - task: PublishTestResults@2
            displayName: Publicar resultados pytest
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'src/**/test-results.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              testRunTitle: 'Pruebas FastAPI Warlus CRM'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true


      - job: FrontendBuild
        displayName: Validar React Vite

        steps:

          - checkout: self
            clean: true

          - powershell: |
              node --version
              npm --version

              if (Test-Path "package-lock.json") {
                  npm ci
              }
              else {
                  npm install
              }

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo npm install/ci"
              }

              npm run build

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo build frontend"
              }

            workingDirectory: frontend
            displayName: Build frontend


  - stage: DockerBuild
    displayName: Construccion Docker
    dependsOn: Validate
    condition: succeeded()

    jobs:

      - job: BuildImages
        displayName: Construir cuatro microservicios

        steps:

          - checkout: self
            clean: true

          - powershell: |
              docker --version

              $services = @(
                  "auth",
                  "catalogo",
                  "pedidos",
                  "pagos"
              )

              foreach ($service in $services) {

                  docker build `
                    -t "warlus-$($service):$(Build.BuildId)" `
                    "./src/$service"

                  if ($LASTEXITCODE -ne 0) {
                      throw "Fallo Docker build: $service"
                  }
              }

            displayName: Build imagenes FastAPI


  - stage: IntegrationSecurity
    displayName: Integracion y seguridad
    dependsOn: DockerBuild
    condition: succeeded()

    jobs:

      - job: SecuritySmoke
        displayName: JWT, aislamiento y dashboard global

        steps:

          - checkout: self
            clean: true

          - powershell: |
              @"
              DB_NAME=warlus_ci
              DB_USER=warlus_ci_user
              DB_PASSWORD=warlus_ci_password

              JWT_SECRET=$(TEST_JWT_SECRET)
              JWT_ISSUER=warlus-crm
              JWT_AUDIENCE=warlus-crm-web
              JWT_EXPIRATION_HOURS=8

              CORS_ORIGINS=http://localhost:5173,http://localhost:4173
              "@ | Set-Content -Encoding ascii ".env.pipeline"

              docker compose `
                -p "warlus-ci-$(Build.BuildId)" `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                config `
                --quiet

              if ($LASTEXITCODE -ne 0) {
                  throw "docker-compose.ci.yml no es valido"
              }

            displayName: Crear y validar entorno CI

          - powershell: |
              $project = "warlus-ci-$(Build.BuildId)"

              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                down `
                --volumes `
                --remove-orphans 2>$null

              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                up `
                -d `
                --build `
                --wait `
                --wait-timeout 120

              if ($LASTEXITCODE -ne 0) {
                  docker compose `
                    -p $project `
                    -f docker-compose.ci.yml `
                    --env-file .env.pipeline `
                    ps

                  docker compose `
                    -p $project `
                    -f docker-compose.ci.yml `
                    --env-file .env.pipeline `
                    logs `
                    --no-color `
                    --tail 150

                  throw "Fallo al levantar entorno CI aislado"
              }

              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                ps

            displayName: Levantar entorno CI aislado

          - powershell: |
              $project = "warlus-ci-$(Build.BuildId)"

              Get-Content `
                "scripts\seed_demo.sql" `
                -Raw |
              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                exec -T postgres `
                psql `
                -v ON_ERROR_STOP=1 `
                -U warlus_ci_user `
                -d warlus_ci

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo seed demo"
              }

              $counts = docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                exec -T postgres `
                psql `
                -U warlus_ci_user `
                -d warlus_ci `
                -t `
                -A `
                -c "SELECT (SELECT COUNT(*) FROM servicios WHERE descripcion LIKE 'DEMO PRESENTACION:%') || '|' || (SELECT COUNT(*) FROM pedidos WHERE cliente LIKE 'Demo - %') || '|' || (SELECT COUNT(*) FROM pagos p JOIN pedidos pe ON pe.id=p.pedido_id WHERE pe.cliente LIKE 'Demo - %');"

              $counts = $counts.Trim()

              Write-Host "Conteos demo: $counts"

              if ($counts -ne "15|20|16") {
                  throw "Conteos demo incorrectos. Esperado 15|20|16, recibido $counts"
              }

            displayName: Cargar y validar demo reproducible

          - powershell: |
              $python = "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe"

              if (-not (Test-Path $python)) {
                  throw "Python 3.12 no esta instalado en el agente."
              }

              $env:AUTH_BASE_URL = "http://localhost:18081"
              $env:CATALOGO_BASE_URL = "http://localhost:18082"
              $env:PEDIDOS_BASE_URL = "http://localhost:18083"
              $env:PAGOS_BASE_URL = "http://localhost:18084"

              & $python "scripts\security_smoke.py"

              if ($LASTEXITCODE -ne 0) {
                  throw "Fallo prueba de seguridad"
              }

            displayName: Probar privacidad y dashboard global

          - powershell: |
              $project = "warlus-ci-$(Build.BuildId)"

              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                ps

              docker compose `
                -p $project `
                -f docker-compose.ci.yml `
                --env-file .env.pipeline `
                down `
                --volumes `
                --remove-orphans

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "El cleanup de Docker devolvio codigo distinto de cero."
              }

            displayName: Limpiar entorno CI
            condition: always()


  - stage: Package
    displayName: Empaquetado desplegable
    dependsOn: IntegrationSecurity
    condition: succeeded()

    jobs:

      - job: PackageServices
        displayName: Empaquetar cuatro backends

        steps:

          - checkout: self
            clean: true

          - powershell: |
              $ErrorActionPreference = "Stop"

              $output = "$(Build.ArtifactStagingDirectory)\backends"

              if (Test-Path $output) {
                  Remove-Item $output -Recurse -Force
              }

              New-Item `
                -ItemType Directory `
                -Path $output `
                -Force |
              Out-Null

              $services = @(
                  "auth",
                  "catalogo",
                  "pedidos",
                  "pagos"
              )

              foreach ($service in $services) {

                  $source = "$(Build.SourcesDirectory)\src\$service"
                  $temp = "$(Build.ArtifactStagingDirectory)\package-$service"
                  $zip = "$output\warlus-$service.zip"

                  if (-not (Test-Path "$source\requirements.txt")) {
                      throw "Falta requirements.txt en $service"
                  }

                  $pythonFiles = Get-ChildItem `
                    -Path $source `
                    -Filter "*.py" `
                    -File

                  if ($pythonFiles.Count -eq 0) {
                      throw "No hay archivos Python en $service"
                  }

                  if (Test-Path $temp) {
                      Remove-Item $temp -Recurse -Force
                  }

                  New-Item `
                    -ItemType Directory `
                    -Path $temp `
                    -Force |
                  Out-Null

                  Copy-Item "$source\*.py" $temp -Force
                  Copy-Item "$source\requirements.txt" $temp -Force

                  Compress-Archive `
                    -Path "$temp\*" `
                    -DestinationPath $zip `
                    -Force

                  if (-not (Test-Path $zip)) {
                      throw "No se genero $zip"
                  }

                  if ((Get-Item $zip).Length -le 0) {
                      throw "El ZIP $service esta vacio"
                  }

                  Write-Host "$service => $((Get-Item $zip).Length) bytes"
              }

              $zips = Get-ChildItem `
                -Path $output `
                -Filter "warlus-*.zip" `
                -File

              if ($zips.Count -ne 4) {
                  throw "Se esperaban 4 ZIP y se encontraron $($zips.Count)"
              }

              Write-Host ""
              Write-Host "Paquetes generados:"
              $zips | Select-Object Name, Length | Format-Table -AutoSize

            displayName: Crear y validar cuatro ZIP

          - task: PublishPipelineArtifact@1
            displayName: Publicar backends
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)\backends'
              artifact: 'warlus-backends'
              publishLocation: 'pipeline'