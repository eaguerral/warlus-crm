trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - qa
      - prod
      - main

pool:
  name: Default

variables:
  nodeVersion: '22.x'

stages:

  - stage: Validate
    displayName: Validación de microservicios
    jobs:
      - job: ValidateServices
        displayName: Validar Node.js, dependencias y pruebas
        steps:

          - task: UseNode@1
            displayName: Instalar Node.js 22
            inputs:
              version: $(nodeVersion)

          - script: |
              node --version
              npm --version
            displayName: Verificar versiones

          - script: npm ci
            workingDirectory: src/auth
            displayName: Instalar dependencias Auth

          - script: node --check index.js
            workingDirectory: src/auth
            displayName: Validar sintaxis Auth

          - script: npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
            workingDirectory: src/auth
            displayName: Ejecutar pruebas Auth

          - script: npm ci
            workingDirectory: src/catalogo
            displayName: Instalar dependencias Catálogo

          - script: node --check index.js
            workingDirectory: src/catalogo
            displayName: Validar sintaxis Catálogo

          - script: npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
            workingDirectory: src/catalogo
            displayName: Ejecutar pruebas Catálogo

          - script: npm ci
            workingDirectory: src/pedidos
            displayName: Instalar dependencias Pedidos

          - script: node --check index.js
            workingDirectory: src/pedidos
            displayName: Validar sintaxis Pedidos

          - script: npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
            workingDirectory: src/pedidos
            displayName: Ejecutar pruebas Pedidos

          - script: npm ci
            workingDirectory: src/pagos
            displayName: Instalar dependencias Pagos

          - script: node --check index.js
            workingDirectory: src/pagos
            displayName: Validar sintaxis Pagos

          - script: npm test -- --test-reporter=junit --test-reporter-destination=test-results.xml
            workingDirectory: src/pagos
            displayName: Ejecutar pruebas Pagos

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'src/**/test-results.xml'
              mergeTestResults: true
              testRunTitle: 'Pruebas automáticas Warlus CRM'
              failTaskOnFailedTests: true

  - stage: DockerBuild
    displayName: Construcción de imágenes Docker
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: Construir microservicios
        steps:

          - script: docker --version
            displayName: Verificar Docker

          - script: docker build -t warlus-auth:$(Build.BuildId) ./src/auth
            displayName: Build Auth

          - script: docker build -t warlus-catalogo:$(Build.BuildId) ./src/catalogo
            displayName: Build Catálogo

          - script: docker build -t warlus-pedidos:$(Build.BuildId) ./src/pedidos
            displayName: Build Pedidos

          - script: docker build -t warlus-pagos:$(Build.BuildId) ./src/pagos
            displayName: Build Pagos

          - script: docker images
            displayName: Verificar imágenes generadas