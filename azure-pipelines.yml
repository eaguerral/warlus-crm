trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev
      - qa
      - prod
      - main

pool:
  name: Default

variables:
  nodeVersion: '22.x'

stages:

  - stage: Validate
    displayName: Validación de microservicios

    jobs:
      - job: ValidateServices
        displayName: Validar Node.js, dependencias y pruebas

        steps:

          - task: UseNode@1
            displayName: Instalar Node.js 22
            inputs:
              version: $(nodeVersion)

          - script: |
              node --version
              npm --version
            displayName: Verificar versiones

          - script: npm ci
            workingDirectory: src/auth
            displayName: Instalar dependencias Auth

          - script: node --check index.js
            workingDirectory: src/auth
            displayName: Validar sintaxis Auth

          - script: node --test --test-reporter=junit > test-results.xml
            workingDirectory: src/auth
            displayName: Ejecutar pruebas Auth

          - script: npm ci
            workingDirectory: src/catalogo
            displayName: Instalar dependencias Catálogo

          - script: node --check index.js
            workingDirectory: src/catalogo
            displayName: Validar sintaxis Catálogo

          - script: node --test --test-reporter=junit > test-results.xml
            workingDirectory: src/catalogo
            displayName: Ejecutar pruebas Catálogo

          - script: npm ci
            workingDirectory: src/pedidos
            displayName: Instalar dependencias Pedidos

          - script: node --check index.js
            workingDirectory: src/pedidos
            displayName: Validar sintaxis Pedidos

          - script: node --test --test-reporter=junit > test-results.xml
            workingDirectory: src/pedidos
            displayName: Ejecutar pruebas Pedidos

          - script: npm ci
            workingDirectory: src/pagos
            displayName: Instalar dependencias Pagos

          - script: node --check index.js
            workingDirectory: src/pagos
            displayName: Validar sintaxis Pagos

          - script: node --test --test-reporter=junit > test-results.xml
            workingDirectory: src/pagos
            displayName: Ejecutar pruebas Pagos

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'src/**/test-results.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              testRunTitle: 'Pruebas automáticas Warlus CRM'
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

  - stage: DockerBuild
    displayName: Construcción de imágenes Docker
    dependsOn: Validate
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: Construir microservicios

        steps:

          - script: docker --version
            displayName: Verificar Docker

          - script: docker build -t warlus-auth:$(Build.BuildId) ./src/auth
            displayName: Build Auth

          - script: docker build -t warlus-catalogo:$(Build.BuildId) ./src/catalogo
            displayName: Build Catálogo

          - script: docker build -t warlus-pedidos:$(Build.BuildId) ./src/pedidos
            displayName: Build Pedidos

          - script: docker build -t warlus-pagos:$(Build.BuildId) ./src/pagos
            displayName: Build Pagos

          - script: docker images
            displayName: Verificar imágenes generadas

  - stage: Deploy
    displayName: Despliegue continuo de Warlus CRM
    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: DeployCompose
        displayName: Desplegar servicios con Docker Compose

        steps:

          - powershell: |
              docker compose -p warlus-crm --env-file .env.example down --remove-orphans
              docker compose -p warlus-crm --env-file .env.example up -d --build
            displayName: Desplegar servicios

          - powershell: |
              Start-Sleep -Seconds 15
              docker compose -p warlus-crm --env-file .env.example ps
            displayName: Verificar contenedores

          - powershell: |
              $services = @(
                  @{
                      Name = "Auth"
                      Url = "http://localhost:8081/health"
                  },
                  @{
                      Name = "Catalogo"
                      Url = "http://localhost:8082/health"
                  },
                  @{
                      Name = "Pedidos"
                      Url = "http://localhost:8083/health"
                  },
                  @{
                      Name = "Pagos"
                      Url = "http://localhost:8084/health"
                  }
              )

              foreach ($service in $services) {

                  Write-Host "Verificando $($service.Name)..."

                  $response = Invoke-RestMethod `
                      -Uri $service.Url `
                      -Method Get

                  if ($response.status -ne "OK") {
                      throw "El servicio $($service.Name) no respondió correctamente."
                  }

                  Write-Host "$($service.Name): OK"
              }
            displayName: Verificar endpoints de salud